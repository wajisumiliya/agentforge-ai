name: AgentForge CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: node --check server/index.js
      - run: cd server && npm install
      - run: node --test server/tests/*.test.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ai/requirements.txt
      - run: python -m compileall -q ai
      - run: cd ai && python -m unittest discover -p 'test_*.py' -v
