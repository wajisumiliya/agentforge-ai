name: AgentForge CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Upload production frontend build
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - run: node --check server/index.js
      - run: cd server && npm install
      - run: node --test server/tests/*.test.mjs
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ai/requirements.txt
      - run: python -m compileall -q ai
      - run: cd ai && python -m unittest discover -p 'test_*.py' -v

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full Windows build and tests
        shell: pwsh
        run: ./build-check.ps1
      - name: Upload Windows frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-windows-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
